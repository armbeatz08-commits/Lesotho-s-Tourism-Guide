    <main>
        <section class="page-header">
  <h1>Photo Gallery</h1>
  <p class="lead">Click any photo to view it larger</p>
</section>

<section class="container py-5">
    <div class="text-center mb-4">
        <img id="previewImg" src="images/maletsunyane.jpg" alt="Gallery preview" class="preview-img rounded">
        <p id="previewCaption" class="mt-2 fw-semibold"></p>
        <button class="btn btn-outline-brand me-2" id="previewPrev">&laquo; Previous</button>
        <button class="btn btn-brand" id="previewNext">Next &raquo;</button>
    </div>
  <div class="row g-3" id="gallery">
    <div class="col-6 col-md-4 col-lg-3">
      <img src="images/maletsunyane.jpg" class="gallery-img" alt="Maletsunyane Falls" data-caption="Maletsunyane Falls, Semonkong">
    </div>
    <div class="col-6 col-md-4 col-lg-3">
      <img src="images/thababosiu.jpg" class="gallery-img" alt="Thaba-Bosiu mountain" data-caption="Thaba-Bosiu, birthplace of the Basotho nation">
    </div>
    <div class="col-6 col-md-4 col-lg-3">
      <img src="images/sanipass.jpg" class="gallery-img" alt="Sani Pass road" data-caption="Sani Pass">
    </div>
    <div class="col-6 col-md-4 col-lg-3">
      <img src="images/afriski.jpg" class="gallery-img" alt="Skiing at Afriski" data-caption="Afriski Mountain Resort">
    </div>
    <div class="col-6 col-md-4 col-lg-3">
      <img src="images/ponytrek.jpg" class="gallery-img" alt="Pony trekking" data-caption="Pony trekking in the Maloti">
    </div>
    <div class="col-6 col-md-4 col-lg-3">
      <img src="images/maliba.jpg" class="gallery-img" alt="Maliba mountain lodge" data-caption="A cosy mountain lodge">
    </div>
</section>
<!-- Lightbox modal -->
<div class="modal fade" id="lightbox" tabindex="-1" aria-labelledby="lightboxCaption" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header border-0">
        <h2 class="modal-title h6" id="lightboxCaption"></h2>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center position-relative">
        <img id="lightboxImg" src="" alt="" class="img-fluid rounded">
      </div>
      <div class="modal-footer border-0 justify-content-between">
        <button class="btn btn-brand" id="prevBtn">&laquo; Previous</button>
        <span id="counter"></span>
        <button class="btn btn-brand" id="nextBtn">Next &raquo;</button>
      </div>
    </div>
  </div>
</div>
